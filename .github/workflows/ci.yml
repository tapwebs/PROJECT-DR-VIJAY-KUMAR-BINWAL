name: Showcase CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify Architecture Integrity
        run: |
          echo "Verifying Showcase repository structure..."
          test -f README.md
          test -f package.json
          test -f .env.example
          test -d src/app
          test -d src/components
          test -d cms-schemas
          echo "Showcase verification successful!"

