version: '3.8'

services:
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  websitecms:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cms
    ports:
      - "3333:3333"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
